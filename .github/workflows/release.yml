name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The tag names the plugin's version
        run: test "v$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')" = "$GITHUB_REF_NAME"
      - name: The skill and its SHA-256 sum, which the installer checks
        run: mkdir dist && cp skills/wirk/SKILL.md dist/ && cd dist && sha256sum -- SKILL.md > SHA256SUMS && cat SHA256SUMS
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/SKILL.md dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --verify-tag --notes "The WIRK skill. Install the WIRK CLI and MCP with uv; then add this skill"
