name: Skill checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: zsh, for the shell-safety tests
        run: command -v zsh || { sudo apt-get update -q && sudo apt-get install -y -q zsh; }
      - run: python -m pip install pytest pyyaml
      # The skill's commands are also parsed by the wirk grammar installed from the requested release.
      - run: python -m pip install "wirk==0.4.25"
      - run: python -m pytest tests -q -rs
