name: Skill checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: zsh, for the shell-safety tests
        run: command -v zsh || { sudo apt-get update -q && sudo apt-get install -y -q zsh; }
      - run: python -m pip install pytest pyyaml
      # The skill's commands are also parsed by the wirk grammar: the release once published, the CLI's main until then.
      - if: ${{ !github.event.repository.private }}
        run: python -m pip install "wirk==0.4.0" || python -m pip install "wirk @ git+https://github.com/wirkspace/wirk-cli@main"
      - run: python -m pytest tests -q -rs
